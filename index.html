<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tsum メニュー操作パネル</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-card: #1c273e;
            --accent-gold: #f59e0b;
            --accent-pink: #ec4899;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #2e3d5c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 900px;
            margin-bottom: 24px;
            text-align: center;
        }

        .header h1 {
            color: var(--accent-gold);
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-blue);
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .menu-id {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
            color: var(--text-secondary);
        }

        .menu-label {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-primary);
        }

        .menu-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .btn {
            background-color: var(--accent-blue);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn:hover { opacity: 0.9; }
        .btn-gold { background-color: var(--accent-gold); color: #000; }
        .btn-pink { background-color: var(--accent-pink); color: #fff; }
        .btn-green { background-color: var(--accent-green); color: #fff; }

        .console-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .console-output {
            background-color: #050811;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            color: #34d399;
            height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .config-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .config-card input {
            background-color: #050811;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fa-solid fa-gamepad"></i> Tsum メニュー実行パネル</h1>
    </div>

    <div class="container">

        <!-- API接続先の設定 -->
        <div class="config-card">
            <span style="font-size:0.9rem; white-space:nowrap; color:var(--text-secondary);">API2 サーバーURL:</span>
            <input type="text" id="api-url" value="http://localhost:5000/api/execute">
        </div>

        <!-- コイン処理 -->
        <div>
            <div class="section-title" style="color: var(--accent-gold);">
                <i class="fa-solid fa-coins"></i> コイン処理
            </div>
            <div class="grid-container" id="coin-menus"></div>
        </div>

        <!-- ボックス・ガチャ完売処理 -->
        <div>
            <div class="section-title" style="color: var(--accent-pink);">
                <i class="fa-solid fa-box-open"></i> ボックス・ガチャ処理
            </div>
            <div class="grid-container" id="gacha-menus"></div>
        </div>

        <!-- プレイヤーレベル処理 -->
        <div>
            <div class="section-title" style="color: var(--accent-green);">
                <i class="fa-solid fa-chart-line"></i> レベル処理
            </div>
            <div class="grid-container" id="level-menus"></div>
        </div>

        <!-- 実行ログ -->
        <div class="console-card">
            <div class="section-title">
                <i class="fa-solid fa-terminal"></i> 実行結果ログ
            </div>
            <div class="console-output" id="log-console">[SYSTEM] メニューを選択して「実行」ボタンを押してください。</div>
        </div>

    </div>

    <script>
        const menuData = {
            "menu8": { "label": "5000万コイン", "price": 0, "desc": "5000万コイン処理", "type": "coin", "btnClass": "btn-gold", "icon": "fa-sack-dollar" },
            "menu1": { "label": "1億コイン", "price": 0, "desc": "1億コイン処理", "type": "coin", "btnClass": "btn-gold", "icon": "fa-coins" },
            "menu7": { "label": "2億コイン", "price": 0, "desc": "2億コイン処理", "type": "coin", "btnClass": "btn-gold", "icon": "fa-gem" },
            "menu3": { "label": "プレミアムBOX完売", "price": 0, "desc": "プレミアムBOXを完売まで処理", "type": "gacha", "btnClass": "btn-pink", "icon": "fa-crown" },
            "menu4": { "label": "ハピネスBOX完売", "price": 0, "desc": "ハピネスボックスを完売まで処理", "type": "gacha", "btnClass": "btn-pink", "icon": "fa-face-smile" },
            "menu5": { "label": "ピックアップガチャ完売", "price": 0, "desc": "開催中のピックアップガチャを完売まで処理", "type": "gacha", "btnClass": "btn-pink", "icon": "fa-star" },
            "menu9": { "label": "プレミアムBOX+完売", "price": 0, "desc": "開催中のプレミアムBOX+を完売まで処理", "type": "gacha", "btnClass": "btn-pink", "icon": "fa-wand-magic-sparkles" },
            "menu6": { "label": "プレイヤーレベルMAX", "price": 0, "desc": "プレイヤーレベルをMAX方向へ処理", "type": "level", "btnClass": "btn-green", "icon": "fa-angles-up" }
        };

        const coinContainer = document.getElementById('coin-menus');
        const gachaContainer = document.getElementById('gacha-menus');
        const levelContainer = document.getElementById('level-menus');

        Object.keys(menuData).forEach(key => {
            const item = menuData[key];
            const card = document.createElement('div');
            card.className = 'card';

            card.innerHTML = `
                <div>
                    <div class="menu-header">
                        <div class="menu-label">${item.label}</div>
                        <span class="menu-id">${key}</span>
                    </div>
                    <div class="menu-desc">${item.desc}</div>
                </div>
                <button class="btn ${item.btnClass}" onclick="executeMenu('${key}')">
                    <i class="fa-solid ${item.icon}"></i> 実行する
                </button>
            `;

            if (item.type === 'coin') coinContainer.appendChild(card);
            else if (item.type === 'gacha') gachaContainer.appendChild(card);
            else if (item.type === 'level') levelContainer.appendChild(card);
        });

        function log(msg) {
            const consoleBox = document.getElementById('log-console');
            const time = new Date().toLocaleTimeString();
            consoleBox.textContent += `\n[${time}] ${msg}`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        // api2.py へ実際にPOST送信する関数
        async function executeMenu(menuKey) {
            const item = menuData[menuKey];
            const targetUrl = document.getElementById('api-url').value;

            log(`[送信中] ${menuKey.toUpperCase()} (${item.label}) -> ${targetUrl}`);

            try {
                const response = await fetch(targetUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        menu: menuKey,
                        label: item.label
                    })
                });

                const resData = await response.json();

                if (response.ok) {
                    log(`[成功] ${menuKey.toUpperCase()} 完了: ${JSON.stringify(resData)}`);
                } else {
                    log(`[エラー] サーバーエラー (${response.status}): ${JSON.stringify(resData)}`);
                }
            } catch (err) {
                log(`[通信失敗] api2.py に接続できませんでした。\n詳細: ${err.message}`);
            }
        }
    </script>
</body>
</html>
